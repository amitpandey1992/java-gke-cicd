apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: {{ .Values.taskService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      initContainers:
        - name: newrelic-agent-init
          image: newrelic/java-agent-init:latest
          volumeMounts:
            - name: newrelic-agent-volume
              mountPath: /newrelic
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      containers:
        - name: task-service
          image: "{{ .Values.taskService.image.repository }}:{{ .Values.taskService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/newrelic/newrelic.jar"
            - name: NEW_RELIC_APP_NAME
              value: "task-service"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-secrets
                  key: license-key
          volumeMounts:
            - name: newrelic-agent-volume
              mountPath: /newrelic
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: newrelic-agent-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: task-service
