---
# Task Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.taskService.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.taskService.name }}
    app.kubernetes.io/part-of: java-app
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.taskService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.taskService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.taskService.name }}
    spec:
      {{- if .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.taskService.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.taskService.image.name }}:{{ .Values.taskService.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.taskService.port }}
              name: http
          env:
            {{- range $key, $val := .Values.taskService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: postgres-password
          resources:
            {{- toYaml .Values.taskService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.taskService.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.taskService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15

