# Baseline Configuration for java-app Helm Chart

global:
  environment: production
  domain: java-gke-app.duckdns.org
  staticIp: 35.232.126.138

# Container Registry & Artifactory Settings
artifactory:
  enabled: false
  dockerConfigJson: ""

image:
  registry: my-jfrog-artifactory.duckdns.org/docker-local
  pullPolicy: Always
  imagePullSecrets:
    - name: artifactory-docker-secret

# PostgreSQL Database (Supports both .Values.postgres and .Values.postgresql)
postgres:
  enabled: true
  password: "postgres-secure-password-123!"

postgresql:
  enabled: true
  name: postgres-service
  password: "postgres-secure-password-123!"
  database: appdb
  user: postgres
  image:
    repository: postgres
    tag: "15"
  port: 5432
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# New Relic License Key Settings
newrelic:
  licenseKey: "dummy-key-replace-in-secret"

# Task Service Microservice (Java 17 Spring Boot)
taskService:
  name: task-service
  replicaCount: 2
  image:
    repository: my-jfrog-artifactory.duckdns.org/docker-local/task-service
    name: task-service
    tag: latest
  port: 8080
  env:
    SPRING_PROFILES_ACTIVE: prod
    DB_HOST: postgres-service
    DB_PORT: "5432"
    DB_NAME: appdb
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Quote Service Microservice (Java 17 Spring Boot)
quoteService:
  name: quote-service
  replicaCount: 2
  image:
    repository: my-jfrog-artifactory.duckdns.org/docker-local/quote-service
    name: quote-service
    tag: latest
  port: 8081
  env:
    SPRING_PROFILES_ACTIVE: prod
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Frontend (Nginx)
frontend:
  name: frontend
  replicaCount: 2
  loadBalancerIP: ""
  image:
    repository: my-jfrog-artifactory.duckdns.org/docker-local/frontend
    name: frontend
    tag: latest
  port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress Configuration
ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "java-gke-static-ip"
    networking.gke.io/managed-certificates: "java-app-ssl-cert"
  hosts:
    - host: java-gke-app.duckdns.org
      paths:
        - path: /*
          pathType: ImplementationSpecific
          serviceName: frontend
          servicePort: 80
