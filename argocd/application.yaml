apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-app-gitops
  namespace: argocd
  labels:
    app.kubernetes.io/name: java-app-gitops
    app.kubernetes.io/part-of: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/amitpandey1992/java-gke-cicd'
    targetRevision: main
    path: helm/java-app
    helm:
      valueFiles:
        - values-gitops.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: java-app-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
