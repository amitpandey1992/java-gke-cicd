name: CI/CD Pipeline - Deploy to K3s Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to K3s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_VM_IP }}
          username: ubuntu
          key: ${{ secrets.K8S_VM_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/namespace.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/configmap.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/secret.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/postgres.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/app.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/ingress.yaml
            kubectl rollout restart deployment/ai-analyzer-deployment -n ai-analyzer
            kubectl rollout status deployment/ai-analyzer-deployment -n ai-analyzer --timeout=120s
