name: Build and Deploy Java App to GKE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Required permissions for Workload Identity Federation (OIDC)
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      ARTIFACT_REPO: java-app-repo
      GKE_CLUSTER: java-gke-cluster
      IMAGE_NAME: demo-java-app

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Authenticate to GCP using Workload Identity Federation (Keyless Auth)
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Step 4: Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 5: Configure Docker Authentication for GCP Artifact Registry
      - name: Configure Docker CLI for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Step 6: Build & Push Container Image using Gradle Jib
      - name: Build and Push Image with Jib
        run: |
          chmod +x gradlew || true
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          ./gradlew jib \
            -Djib.to.image=${IMAGE_URI}:${{ github.sha }} \
            -Djib.to.tags=latest

      # Step 7: Set up Helm CLI
      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Step 8: Get GKE Cluster Credentials
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      # Step 9: Deploy application to GKE using Helm
      - name: Deploy Helm Chart to GKE
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          helm upgrade --install java-app ./helm/java-app \
            --set image.repository=${IMAGE_URI} \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
