name: Build and Deploy Microservices to GKE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Required permissions for Workload Identity Federation (OIDC)
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      ARTIFACT_REPO: java-app-repo
      GKE_CLUSTER: java-gke-cluster

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 for Spring Boot builds
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Authenticate to GCP using Workload Identity Federation (Keyless Auth)
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Step 4: Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 5: Configure Docker Authentication for GCP Artifact Registry
      - name: Configure Docker CLI for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Step 6: Build & Push task-service using Gradle Jib
      - name: Build and Push Task Service with Jib
        run: |
          cd task-service
          chmod +x gradlew || true
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/task-service"
          ./gradlew jib \
            -Djib.to.image=${IMAGE_URI}:${{ github.sha }} \
            -Djib.to.tags=latest

      # Step 7: Build & Push quote-service using Gradle Jib
      - name: Build and Push Quote Service with Jib
        run: |
          cd quote-service
          chmod +x gradlew || true
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/quote-service"
          ./gradlew jib \
            -Djib.to.image=${IMAGE_URI}:${{ github.sha }} \
            -Djib.to.tags=latest

      # Step 8: Build & Push Nginx frontend using standard Docker Build
      - name: Build and Push Frontend Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend"
          docker build -t ${IMAGE_URI}:${{ github.sha }} -t ${IMAGE_URI}:latest ./frontend
          docker push ${IMAGE_URI}:${{ github.sha }}
          docker push ${IMAGE_URI}:latest

      # Step 9: Set up Helm CLI
      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Step 10: Get GKE Cluster Credentials
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      # Step 11: Deploy application to GKE using Helm
      - name: Deploy Helm Chart to GKE
        run: |
          FE_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend"
          TASK_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/task-service"
          QUOTE_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/quote-service"
          
          helm upgrade --install java-app ./helm/java-app \
            --set frontend.image.repository=${FE_REPO} \
            --set frontend.image.tag=${{ github.sha }} \
            --set taskService.image.repository=${TASK_REPO} \
            --set taskService.image.tag=${{ github.sha }} \
            --set quoteService.image.repository=${QUOTE_REPO} \
            --set quoteService.image.tag=${{ github.sha }} \
            --wait --timeout 5m
