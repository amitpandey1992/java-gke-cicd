name: Build and Deploy Microservices to GKE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    # Required permissions for Workload Identity Federation (OIDC)
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      ARTIFACT_REPO: java-app-repo
      GKE_CLUSTER: java-gke-cluster

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 for Spring Boot builds
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Authenticate to GCP using Workload Identity Federation (Keyless Auth)
      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}


      # Step 4: Configure gcloud with access token for Cloud Build and Artifact Registry
      - name: Configure gcloud access token
        run: |
          gcloud config set auth/access_token_file /dev/stdin <<< "${{ steps.auth.outputs.access_token }}" || true
          gcloud auth print-access-token > /dev/null && echo "gcloud auth OK"

      # Step 6: Build & Push task-service using Gradle Jib
      - name: Build and Push Task Service with Jib
        run: |
          cd task-service
          chmod +x gradlew || true
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/task-service"
          ./gradlew jib \
            -Djib.to.image=${IMAGE_URI}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=oauth2accesstoken \
            -Djib.to.auth.password=${{ steps.auth.outputs.access_token }}

      # Step 7: Build & Push quote-service using Gradle Jib
      - name: Build and Push Quote Service with Jib
        run: |
          cd quote-service
          chmod +x gradlew || true
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/quote-service"
          ./gradlew jib \
            -Djib.to.image=${IMAGE_URI}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=oauth2accesstoken \
            -Djib.to.auth.password=${{ steps.auth.outputs.access_token }}

      # Step 8: Build & Push Nginx frontend using Google Cloud Build (no local docker needed)
      - name: Build and Push Frontend via Cloud Build
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend"
          gcloud builds submit ./frontend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --tag=${IMAGE_URI}:${{ github.sha }} \
            --access-token-file=<(echo "${{ steps.auth.outputs.access_token }}") || \
          gcloud builds submit ./frontend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --tag=${IMAGE_URI}:${{ github.sha }}


      # Step 10: Get GKE Cluster Credentials
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      # Step 11: Clean up old StatefulSet (one-time migration to Deployment)
      - name: Cleanup old Postgres StatefulSet
        run: |
          echo "Force deleting old postgres pods..."
          kubectl delete pods -l app=postgres --force --grace-period=0 --ignore-not-found=true
          
          echo "Deleting old StatefulSet without waiting..."
          kubectl delete statefulset postgres --ignore-not-found=true --wait=false
          
          echo "Removing finalizers from PVC to prevent deletion hang..."
          kubectl patch pvc postgres-pvc -p '{"metadata":{"finalizers":null}}' --type=merge --ignore-not-found=true || true
          
          echo "Deleting old PVC..."
          kubectl delete pvc postgres-pvc --ignore-not-found=true --wait=false
          
          echo "Cleanup triggered successfully. Fresh PVC/Deployment will be created by Helm."

      # Step 12: Deploy application to GKE using Helm
      - name: Deploy Helm Chart to GKE
        run: |
          FE_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend"
          TASK_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/task-service"
          QUOTE_REPO="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/quote-service"
          
          helm upgrade --install java-app ./helm/java-app \
            --set frontend.image.repository=${FE_REPO} \
            --set frontend.image.tag=${{ github.sha }} \
            --set taskService.image.repository=${TASK_REPO} \
            --set taskService.image.tag=${{ github.sha }} \
            --set quoteService.image.repository=${QUOTE_REPO} \
            --set quoteService.image.tag=${{ github.sha }} \
            --set newrelic.licenseKey="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --wait --timeout 5m

      # Step 13: Deploy New Relic Infrastructure Monitoring Bundle (EU Region)
      - name: Deploy New Relic Monitoring Bundle
        run: |
          if [ -n "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            echo "Installing New Relic Infrastructure Agent..."
            helm repo add newrelic https://helm-charts.newrelic.com
            helm repo update
            helm upgrade --install newrelic-bundle newrelic/nri-bundle \
              --namespace newrelic --create-namespace \
              --set global.licenseKey="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --set global.cluster="java-gke-cluster" \
              --set global.region="EU" \
              --set newrelic-infrastructure.enabled=true \
              --set kube-state-metrics.enabled=true \
              --set pixiesizing.enabled=false \
              --wait --timeout 5m
          else
            echo "NEW_RELIC_LICENSE_KEY secret is not set, skipping infrastructure monitoring deployment."
          fi
