apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-analyzer-ingress
  namespace: ai-analyzer
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-analyzer-service
            port:
              number: 8000
