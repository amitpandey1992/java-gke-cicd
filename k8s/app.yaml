apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer-deployment
  namespace: ai-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-analyzer
  template:
    metadata:
      labels:
        app: ai-analyzer
    spec:
      containers:
      - name: ai-analyzer
        image: ghcr.io/ajitp/ai-cicd-analyzer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyzer-service
  namespace: ai-analyzer
spec:
  type: ClusterIP
  selector:
    app: ai-analyzer
  ports:
  - port: 8000
    targetPort: 8000
